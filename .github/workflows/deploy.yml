name: Deploy Terraform IaC
# Deploy EC2 instance using Terraform

on:
  push:

env:
  AWS_DEFAULT_REGION: u-central-1
#   AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
#   AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

jobs:
  deploy_to_aws:
    runs-on: ubuntu-latest

    steps:
    # 1. Downloading the code from the repository to the virtual machine GitHub
    - name: Checkout Source Code
      uses: actions/checkout@v6

    - name: Test install app
      run: |
           echo "Testing app installation..."
           terraform --version
